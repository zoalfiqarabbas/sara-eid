<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sara ❤️</title>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
  font-family: monospace;
  color: #00ffcc;
  text-align: center;
}

/* stars */
canvas {
  position: fixed;
  top: 0;
  left: 0;
}

/* name */
h1 {
  font-size: 70px;
  margin-top: 60px;
  letter-spacing: 15px;
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 10px #00ffcc; }
  to { text-shadow: 0 0 40px #00ffcc, 0 0 80px #00ffcc; }
}

/* heart */
.heart {
  font-size: 120px;
  animation: beat 1s infinite;
}

@keyframes beat {
  0% { transform: scale(1); }
  50% { transform: scale(1.3); }
  100% { transform: scale(1); }
}

/* text */
.text {
  margin-top: 30px;
  font-size: 22px;
  width: 80%;
  margin-left: auto;
  margin-right: auto;
}

/* typing cursor */
.cursor {
  display: inline-block;
  width: 8px;
  background: #00ffcc;
  animation: blink 1s infinite;
}

@keyframes blink {
  50% { background: transparent; }
}
</style>
</head>

<body>

<canvas id="stars"></canvas>

<h1>SARA</h1>
<div class="heart">❤️</div>

<div class="text" id="typing"></div><span class="cursor"></span>

<!-- music -->
<audio autoplay loop>
  <source src="https://www.bensound.com/bensound-music/bensound-slowmotion.mp3" type="audio/mpeg">
</audio>

<script>
// ⭐ stars animation
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let stars = [];

for (let i = 0; i < 150; i++) {
  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: Math.random() * 2
  });
}

function drawStars() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "white";

  stars.forEach(star => {
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
    ctx.fill();
  });
}

function updateStars() {
  stars.forEach(star => {
    star.y += 0.3;
    if (star.y > canvas.height) star.y = 0;
  });
}

function animate() {
  drawStars();
  updateStars();
  requestAnimationFrame(animate);
}
animate();

// ✨ typing effect
const text = `Dear Sara...

Eid Mubarak ✨

Out of everyone in this world,
you became my favorite feeling.

You’re not just special...
you’re different in a way I can’t explain.

And honestly...

I like you more than words can ever describe ❤️`;

let i = 0;
function typeWriter() {
  if (i < text.length) {
    document.getElementById("typing").innerHTML += text.charAt(i);
    i++;
    setTimeout(typeWriter, 35);
  }
}

setTimeout(typeWriter, 1000);
</script>

</body>
</html>
